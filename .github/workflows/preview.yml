name: Compilar rama (sin publicar)
on:
  push:
    branches-ignore: [main, preview-dist]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilación real (igual que producción)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://icwlksxcrqlbpwvqyxxz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_2LboCybPWEcayGDEZuYW5A_l-4trGDe
      - name: Compilación de prueba con datos de ejemplo
        run: npx vite build --outDir dist-mock
        env:
          VITE_MOCK: '1'
          BASE_PATH: /
      - name: Guardar la compilación de prueba en la rama temporal preview-dist
        run: |
          cd dist-mock
          git init -q -b preview-dist
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "preview ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview-dist
